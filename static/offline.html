<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <title>PRTS · 暂时离线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #111315;
        color: #eeefed;
        font:
          16px/1.8 system-ui,
          sans-serif;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #303438;
        border-top: 2px solid #ff6b35;
      }
      img {
        width: 64px;
        height: 64px;
      }
      small {
        display: block;
        color: #9a9fa5;
        font: 12px/1.8 monospace;
        letter-spacing: 2px;
        margin-top: 20px;
      }
      h1 {
        font-size: 28px;
        font-weight: 500;
        margin: 12px 0;
      }
      p {
        margin: 0 0 24px;
        color: #9a9fa5;
        font-size: 14px;
      }
      a {
        display: block;
        min-height: 44px;
        background: #ff6b35;
        color: #111315;
        text-align: center;
        text-decoration: none;
        padding: 10px 16px;
      }
      a:focus-visible {
        outline: 2px solid #eeefed;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="PRTS" />
      <small>CONNECTION INTERRUPTED</small>
      <h1>终端暂时离线</h1>
      <p>当前无法连接服务器。任务、笔记和文件仍保存在你的服务器上，恢复网络后即可继续使用。</p>
      <a href="/">重新连接终端</a>
    </main>
  </body>
</html>
